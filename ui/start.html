<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your mutual fund check-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --ink:#12262E; --muted:#51646C; --line:#D3DDDB; --accent:#12262E;
  --good:#136F55; --ok:#3F7592; --watch:#9A6806; --attention:#B83A3A; --na:#7A8B91;
  --good-t:#E0F1EA; --ok-t:#E3EEF4; --watch-t:#FBEFD3; --attention-t:#F9E2E2; --na-t:#E7ECEB;
  --good-i:#0C5440; --ok-i:#2B5A74; --watch-i:#7A5200; --attention-i:#8E2424; --na-i:#44565D;
  --on:#FFFFFF; --track:#DCE5E3; --bench:#9DB0B5;
  --display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0E181D; --surface:#16252C; --ink:#E7EFF1; --muted:#9DB1B8; --line:#294049; --accent:#E7EFF1;
  --good:#4CC39B; --ok:#7DB4D2; --watch:#E2B04A; --attention:#EE7C7C; --na:#7F959C;
  --good-t:#12342A; --ok-t:#17313D; --watch-t:#3A2E10; --attention-t:#3D1C1C; --na-t:#223940;
  --good-i:#8FE3C4; --ok-i:#A9D2E8; --watch-i:#F0CB7E; --attention-i:#F7A9A9; --na-i:#B3C4C9;
  --on:#0E181D; --track:#234049; --bench:#5B7882;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#0E181D; --surface:#16252C; --ink:#E7EFF1; --muted:#9DB1B8; --line:#294049; --accent:#E7EFF1;
    --good:#4CC39B; --ok:#7DB4D2; --watch:#E2B04A; --attention:#EE7C7C; --na:#7F959C;
    --good-t:#12342A; --ok-t:#17313D; --watch-t:#3A2E10; --attention-t:#3D1C1C; --na-t:#223940;
    --good-i:#8FE3C4; --ok-i:#A9D2E8; --watch-i:#F0CB7E; --attention-i:#F7A9A9; --na-i:#B3C4C9;
    --on:#0E181D; --track:#234049; --bench:#5B7882;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body);}
.wrap{max-width:52rem;margin:0 auto;padding:0 1rem 4rem}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em}
a,button,summary,label.btn{outline-offset:3px}
:focus-visible{outline:3px solid var(--ok);}
.s-good{color:var(--good)} .s-ok{color:var(--ok)} .s-watch{color:var(--watch)} .s-attention{color:var(--attention)} .s-na{color:var(--na)} .s-info{color:var(--na-i)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:1.25rem 0 .5rem;flex-wrap:wrap}
.top h1{font-size:1.125rem;font-weight:700}
.asof{color:var(--muted);font-size:.9rem}
.sample{background:var(--watch-t);color:var(--watch-i);border-radius:.5rem;padding:.6rem .85rem;font-size:.95rem;margin:.5rem 0 0}

/* hero */
.hero{padding:2rem 0 1.25rem}
.hero h2{font-size:clamp(1.75rem,5.2vw,2.75rem);line-height:1.12;font-weight:700;max-width:22em;text-wrap:balance}
.hero .sub{color:var(--muted);margin:.9rem 0 0;max-width:36em}
.ribbon{display:flex;gap:3px;height:3.75rem;margin:1.75rem 0 .9rem}
.seg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:flex-end;padding:.45rem .6rem;border-radius:.4rem;
  background:var(--c);color:var(--on);font:700 .8rem/1.15 var(--body);overflow:hidden;min-width:.9rem;
  transform-origin:left;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n)*90ms)}
.seg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg:hover{filter:brightness(1.08)}
@keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:.35rem 1.25rem;list-style:none;padding:0;margin:0;font-size:.92rem;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:.45rem}
.legend i{width:.8rem;height:.8rem;border-radius:.2rem;background:var(--c);display:inline-block}

/* sections */
section{margin-top:2.75rem}
section>h3{font-size:1.4rem;font-weight:700}
section>.lede{color:var(--muted);margin:.35rem 0 1rem;max-width:38em}

/* glance rows */
.rows{border-top:1px solid var(--line);margin-top:1rem}
details.row{border-bottom:1px solid var(--line)}
details.row>summary{display:grid;grid-template-columns:1.5rem 1fr auto;gap:.2rem .9rem;align-items:center;padding:.9rem .1rem;cursor:pointer;list-style:none}
details.row>summary::-webkit-details-marker{display:none}
.row .t{font-family:var(--display);font-weight:700;font-size:1.1rem}
.row .l{grid-column:2;color:var(--muted);font-size:.95rem;line-height:1.45}
.chev{width:1.1rem;height:1.1rem;color:var(--muted);transition:transform .2s;grid-row:1;grid-column:3}
details[open]>summary .chev{transform:rotate(180deg)}
.mk{width:1.5rem;height:1.5rem;flex:none;grid-row:1}
.row-body{padding:.25rem 0 1.25rem 2.4rem}

/* funds */
details.fund{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;margin-top:.75rem}
details.fund>summary{display:grid;grid-template-columns:1fr auto;gap:.15rem 1rem;align-items:center;padding:1rem 1.1rem;cursor:pointer;list-style:none}
details.fund>summary::-webkit-details-marker{display:none}
.fname{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.25}
.fmeta{grid-column:1;color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:0 1rem}
.pill{grid-row:1/3;grid-column:2;display:inline-flex;align-items:center;gap:.4rem;border-radius:2rem;padding:.3rem .75rem .3rem .45rem;font:700 .85rem/1.2 var(--body);background:var(--t);color:var(--i);white-space:nowrap}
.pill .mk{width:1.1rem;height:1.1rem}
.fund-body{padding:0 1.1rem 1.1rem;border-top:1px solid var(--line)}

/* insight */
.ins{padding:1.1rem 0;border-bottom:1px solid var(--line)}
.ins:last-child{border-bottom:0;padding-bottom:0}
.ins-h{display:flex;align-items:center;gap:.6rem}
.ins-h .mk{width:1.25rem;height:1.25rem}
.ins h4{font-size:1.02rem;font-weight:700}
.ins p{margin:.4rem 0 0;max-width:40em}
.who{font-weight:700;color:var(--ink)}
.ask{margin:.6rem 0 0;padding:.55rem .8rem;border-left:3px solid var(--c);background:var(--t);color:var(--i);border-radius:0 .4rem .4rem 0;font-size:.95rem}
.learn{margin-top:.6rem;font-size:.92rem}
.learn summary{cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:3px;width:fit-content}
.learn p{background:var(--bg);border-radius:.5rem;padding:.65rem .85rem;margin-top:.5rem;color:var(--ink)}

/* mini visuals */
.viz{margin:.85rem 0 .2rem;max-width:34rem}
.viz .cap{color:var(--muted);font-size:.88rem;margin-bottom:.4rem}
.br{display:grid;grid-template-columns:5.2rem 1fr 6rem;gap:.65rem;align-items:center;margin:.3rem 0;font-size:.92rem}
.br .trk{height:.7rem;background:var(--track);border-radius:.35rem;overflow:hidden}
.br .fill{display:block;height:100%;background:var(--c);border-radius:.35rem}
.br .fill.bench{background:var(--bench)}
.br b{font-variant-numeric:tabular-nums;text-align:left;font-weight:700}
.dots{display:flex;gap:.35rem;margin:.1rem 0}
.dots i{width:1.15rem;height:1.15rem;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--c)}
.scale{position:relative;height:.7rem;background:linear-gradient(90deg,var(--attention-t),var(--watch-t) 40%,var(--good-t));border:1px solid var(--line);border-radius:.4rem;margin:.9rem 0 .3rem}
.scale i{position:absolute;top:-.45rem;width:.35rem;height:1.55rem;background:var(--ink);border-radius:.2rem;transform:translateX(-50%)}
.scale-l{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem}
.stat{display:flex;flex-wrap:wrap;gap:.3rem 1.75rem;align-items:baseline}
.stat div{display:flex;flex-direction:column}
.stat b{font:700 1.5rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}
.meter{height:.7rem;background:var(--track);border-radius:.35rem;overflow:hidden}
.meter span{display:block;height:100%;background:var(--c)}

/* misc */
.q{margin-top:1.1rem}
.q h4{font-size:1.02rem;margin-bottom:.35rem}
.q ul{margin:0;padding:0;list-style:none}
.q li{display:flex;gap:.6rem;padding:.3rem 0;max-width:40em}
.q .mk{width:1.1rem;height:1.1rem;margin-top:.3rem}
.gaps{margin:.5rem 0 0;padding-left:1.1rem;color:var(--muted);max-width:40em}
.foot{margin-top:3.5rem;padding-top:1.25rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.foot p{max-width:42em;margin:0 0 1rem}
.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5rem .9rem;border-radius:.5rem;font:500 .92rem var(--body);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.err{background:var(--attention-t);color:var(--attention-i);padding:.7rem .9rem;border-radius:.5rem;margin-top:.8rem}

@media (max-width:34rem){
  body{font-size:1rem}
  .br{grid-template-columns:4.4rem 1fr 5.2rem;gap:.5rem}
  .row-body{padding-left:0}
  details.fund>summary{grid-template-columns:1fr}
  .pill{grid-row:auto;grid-column:1;margin-top:.5rem;justify-self:start}
  .ribbon{height:3.25rem}
}
@media (prefers-reduced-motion:reduce){ .seg{animation:none} .chev{transition:none} }
@media print{ body{background:#fff} .foot .btn,.sample{display:none} details>*{display:block} }

/* v2 additions */
.key{display:flex;flex-wrap:wrap;gap:.3rem 1.25rem;color:var(--muted);font-size:.9rem;margin:.2rem 0 0}
.key span{display:inline-flex;align-items:center;gap:.4rem}
.key .mk{width:1.05rem;height:1.05rem}
.chips{grid-column:1;display:flex;flex-wrap:wrap;gap:.2rem .95rem;margin-top:.4rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.88rem;color:var(--ink)}
.chip .mk{width:1rem;height:1rem}
.bl{display:grid;grid-template-columns:1fr 1fr;gap:1rem 2rem;padding:1.1rem 0 .4rem}
.bl h4{font-size:.98rem;margin-bottom:.35rem}
.bl ul{list-style:none;margin:0;padding:0}
.bl li{display:flex;gap:.55rem;padding:.15rem 0;font-size:.97rem}
.bl .mk{width:1.05rem;height:1.05rem;margin-top:.28rem}
details.area{border-top:1px solid var(--line)}
details.area>summary{display:grid;gap:.05rem .8rem;align-items:center;padding:.85rem 0;cursor:pointer;list-style:none}
details.area>summary::-webkit-details-marker{display:none}
.area .t{font-family:var(--display);font-weight:700;font-size:1.05rem}
.area .n{grid-column:2;color:var(--muted);font-size:.9rem;line-height:1.4}
details.area>summary{grid-template-columns:1.5rem 1fr 1.1rem}
.area .lab{margin-left:.55rem;font:700 .82rem var(--body);color:var(--i);background:var(--t);border-radius:2rem;padding:.12rem .55rem;white-space:nowrap}
.area .chev{grid-row:1;grid-column:3}
.area-body{padding:0 0 .6rem 0}
.sec{margin:1.2rem 0 0;font:700 .98rem/1.3 var(--display);color:var(--ink)}
.sec:first-child{margin-top:.2rem}
.what{color:var(--muted);font-size:.9rem;margin:.1rem 0 0;max-width:40em}
.tbl{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:.25rem 1rem;font-size:.9rem;margin-top:.7rem;max-width:30rem}
.tbl>b{font-weight:500;color:var(--muted);font-size:.84rem}
.tbl>span{font-variant-numeric:tabular-nums}
.tbl .d{font-weight:700}
.cal{width:100%;max-width:34rem;height:auto;display:block;margin:.3rem 0 .2rem}
.cal .al{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.vl{font:700 12.5px var(--body);fill:var(--ink)}
.cal .yl{font:500 12px var(--body);fill:var(--muted)}
.key2{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem;font-size:.84rem;color:var(--muted)}
.key2 i{display:inline-block;width:.7rem;height:.7rem;border-radius:.15rem;margin-right:.35rem;vertical-align:-.05rem}
.qrow{display:grid;grid-template-columns:4.6rem auto 1fr;gap:.7rem;align-items:center;margin:.35rem 0;font-size:.92rem}
.qbox{display:inline-flex;gap:3px}
.qbox i{display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:1.5rem;border-radius:.3rem;background:var(--track);color:var(--muted);font:700 .78rem var(--body);font-style:normal}
.qbox i.on{background:var(--c);color:var(--on)}
.hint{color:var(--muted);font-size:.85rem;margin:.35rem 0 0}
.cap.gap{margin-top:.8rem}
@media (max-width:34rem){
  .bl{grid-template-columns:1fr}
  .qrow{grid-template-columns:3.8rem auto 1fr;gap:.5rem}
  .qbox i{width:1.8rem}
  .tbl{gap:.25rem .6rem}
}

/* start screen + states */
.start{padding:2.5rem 0 1rem}
.start h2{font-size:clamp(1.9rem,6vw,3rem);line-height:1.08;font-weight:700;max-width:16em;text-wrap:balance}
.start .sub{color:var(--muted);max-width:34em;margin:1rem 0 0;font-size:1.1rem}
.drop{display:block;margin-top:1.75rem;border:2px dashed var(--line);background:var(--surface);border-radius:1rem;padding:1.6rem 1.25rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--good);background:var(--good-t)}
.drop b{display:block;font:700 1.15rem var(--display)}
.drop span{color:var(--muted);font-size:.92rem}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.start .alt{margin-top:.9rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.steps{list-style:none;margin:2.5rem 0 0;padding:0;display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:1rem 1.1rem}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--ink);color:var(--bg);font:700 .9rem var(--display);margin-bottom:.45rem}
.steps b{display:block;font:700 1.02rem var(--display)}
.steps span{color:var(--muted);font-size:.93rem}
.privacy{margin:.75rem 0 0;font-size:.9rem;color:var(--muted)}
.privacy b{color:var(--ink)}
.checks{margin:2.25rem 0 0}
.checks h3{font-size:1.15rem;margin-bottom:.6rem}
.checks ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem 1.5rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.checks li{font-size:.97rem;color:var(--ink)}
.checks li small{display:block;color:var(--muted);font-size:.87rem}
.state{padding:5rem 0;text-align:center}
.state h2{font-size:1.6rem}
.state p{color:var(--muted);max-width:30em;margin:.7rem auto 0}
.spin{width:2.6rem;height:2.6rem;border-radius:50%;border:4px solid var(--track);border-top-color:var(--good);margin:0 auto 1.25rem;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-top-color:var(--track)}}
.state .err{color:var(--attention-i)}
/* fund facts strip + notes */
.facts{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin:.9rem 0 .2rem;padding:0;list-style:none}
.facts li{background:var(--surface);border:1px solid var(--line);border-radius:2rem;padding:.2rem .7rem;font-size:.86rem;color:var(--muted)}
.facts li b{color:var(--ink);font-weight:700}
.fnote{background:var(--ok-t);color:var(--ok-i);border-radius:.55rem;padding:.6rem .85rem;font-size:.92rem;margin:.8rem 0 0}
.credit{font-size:.82rem;margin-top:.4rem}
</style>
</head>

: "Over 5 years, for every ₹100 the Sample LargeMidcap index gained in rising months, this fund gained ₹82. For every ₹100 it lost in falling months, this fund lost ₹112. That is the least helpful mix.", "fund": "Sample Large & Mid Cap Fund C", "suggestion": "Worth asking whether this mix of gains and falls is what you want from this fund.", "jargon_term": "capture", "numbers": {"upside": 82, "downside": 112, "ratio": 0.73, "years": 5}}, {"id": "risk-sample-large---mid-cap-fund-c", "topic": "risk", "status": "attention", "headline": "Fell much more than its benchmark", "sentence": "In the March 2020 crash, ₹1,00,000 in this fund fell to ₹55,000. In the Sample LargeMidcap index it fell to ₹63,000. Counting from the bottom, this fund took 15 months to get back to its earlier high; the benchmark took 8. Falls this big can happen again, so be sure you could stay invested through one.", "fund": "Sample Large & Mid Cap Fund C", "suggestion": "Worth asking whether you are comfortable with a fall this deep for the extra return you expect.", "jargon_term": "drawdown", "numbers": {"fund_drawdown": -45.0, "bench_drawdown": -37.0, "fund_after": 55000, "bench_after": 63000, "recovery_months": 15, "still_underwater": false, "fall_size": "significant", "bench_recovery_months": 8}}, {"id": "peers-sample-large---mid-cap-fund-c", "topic": "peers", "status": "attention", "headline": "Bottom quarter of its category", "sentence": "Over 5 years, this fund ranked in the bottom quarter (Q4) of 26 Large & Mid Cap funds: behind at least 3 in every 4 similar funds. By period: 1 year Q4, 3 years Q4, 5 years Q4.", "fund": "Sample Large & Mid Cap Fund C", "suggestion": "Worth looking at what the top few funds in this category did differently.", "jargon_term": "quartile", "numbers": {"quartiles": {"1": 4, "3": 4, "5": 4}, "peer_count": 26, "category": "Large & Mid Cap", "average": 4.0}}, {"id": "costs-sample-mid-cap-fund-b", "topic": "costs", "status": "watch", "headline": "Above the category median", "sentence": "This fund charges 2.05% a year. The middle Mid Cap regular plan charges 1.85%, so this fund is 0.20 percentage points more than the middle. On your ₹2,60,000 that is about ₹520 a year more.", "fund": "Sample Mid Cap Fund B", "suggestion": "Worth asking what the higher charge pays for, and whether similar funds in the category deliver the same for less.", "jargon_term": "ter", "numbers": {"ter": 2.05, "plan": "regular", "category": "Mid Cap", "category_median": 1.85, "gap_pts": 0.2, "annual_cost": 5330, "annual_vs_median": 520}}, {"id": "costs-sample-large---mid-cap-fund-c", "topic": "costs", "status": "watch", "headline": "Above the category median", "sentence": "This fund charges 2.15% a year. The middle Large & Mid Cap regular plan charges 1.80%, so this fund is 0.35 percentage points more than the middle. On your ₹1,80,000 that is about ₹630 a year more.", "fund": "Sample Large & Mid Cap Fund C", "suggestion": "Worth asking what the higher charge pays for, and whether similar funds in the category deliver the same for less.", "jargon_term": "ter", "numbers": {"ter": 2.15, "plan": "regular", "category": "Large & Mid Cap", "category_median": 1.8, "gap_pts": 0.35, "annual_cost": 3870, "annual_vs_median": 630}}, {"id": "mix-fund", "topic": "mix", "status": "watch", "headline": "One fund carries a lot of weight", "sentence": "Sample Flexi Cap Fund A is 37% of your portfolio, so how it does matters more than any other fund.", "fund": null, "suggestion": "Worth confirming you are comfortable with one fund being this large.", "jargon_term": "concentration", "numbers": {"fund": "Sample Flexi Cap Fund A", "share_pct": 36.5}}, {"id": "facts-manager-sample-mid-cap-fund-b", "topic": "manager", "status": "watch", "headline": "The fund manager changed recently", "sentence": "B. Sample has run this fund since Mar 2026, which is 7 months. Part of the track record above may belong to a previous manager.", "fund": "Sample Mid Cap Fund B", "suggestion": "Worth asking what changed with the new manager and whether the approach is the same.", "jargon_term": "manager", "numbers": {"months": 7, "since": "2026-03-01", "names": ["B. Sample"]}}, {"id": "facts-size-sample-thematic-fund-e", "topic": "size", "status": "watch", "headline": "A small fund", "sentence": "The fund manages about ₹62 crore in total, across all its plans. That is small for a mutual fund.", "fund": "Sample Thematic Fund E", "suggestion": "Worth asking whether a fund this small is likely to stay open and keep its costs low.", "jargon_term": "aum", "numbers": {"aum_cr": 62}}, {"id": "facts-age-sample-thematic-fund-e", "topic": "age", "status": "watch", "headline": "A short track record", "sentence": "This fund is about 1.7 years old. Launched in Jan 2025. That is too short to have been through a long market fall.", "fund": "Sample Thematic Fund E", "suggestion": "Worth remembering that a short record says little about how it behaves in a long market fall.", "jargon_term": null, "numbers": {"years": 1.7, "allotment_date": "2025-01-20"}}], "data_gaps": ["Sample Thematic Fund E: year-by-year returns is not shown because the data is not available.", "Sample Thematic Fund E: rolling-return consistency is not shown because the data is not available.", "Sample Thematic Fund E: upside and downside capture is not shown because the data is not available.", "Sample Thematic Fund E: worst-fall comparison is not shown because the data is not available.", "Sample Thematic Fund E: quartile ranking in its category is not shown because the data is not available."], "glossary": {"cagr": {"title": "Returns, a year at a time (CAGR)", "text": "CAGR is the steady yearly growth rate that would turn your starting amount into the final amount. It smooths out the ups and downs so you can compare funds fairly. The benchmark is the market index the fund is measured against."}, "calendar": {"title": "Calendar-year returns and margin (alpha)", "text": "How the fund did from 1 January to 31 December of each year. It shows whether the results came every year or from one or two big years. The margin (often called alpha) is simply the fund's return minus the benchmark's for that year: +3 means 3 percentage points ahead, -2 means 2 behind. It is not the regression-based alpha some websites show."}, "capture": {"title": "Upside and downside capture", "text": "Take all the months the market (the benchmark) went up. Upside capture is how much of that rise the fund delivered. Do the same for the falling months and you get downside capture. Above 100 means more than the market, below 100 means less. You want upside high and downside low."}, "quartile": {"title": "Quartile ranking", "text": "Line up every fund in the same category from best to worst, then cut the line into four equal groups. Q1 is the best quarter and Q4 is the worst."}, "rolling_returns": {"title": "Rolling returns", "text": "Instead of checking one start date, we check every possible start date and look at the returns over each 3-year (or 5-year) stretch. It shows how consistent a fund is, not whether it got lucky with one date."}, "drawdown": {"title": "Worst fall (drawdown)", "text": "How far the value dropped from its highest point to its lowest before recovering. It answers: how bad did it get, and could I have lived with that?"}, "ter": {"title": "Fund charges (TER)", "text": "The yearly fee the fund house takes out of your money, shown as a percentage. It is already deducted from the returns you see. We compare it with the median (middle) fee of funds in the same category and the same type of plan, direct with direct and regular with regular, so the comparison is like for like."}, "aum": {"title": "Fund size (AUM)", "text": "AUM is the total money all investors have put into the fund. Very small funds can be costlier to run and are sometimes merged or closed; very large ones can find it harder to trade freely."}, "manager": {"title": "Fund manager", "text": "The person or team that picks the fund's investments. A track record belongs to whoever managed the fund at the time, so a recent change means the past may say less about the future."}, "tracking": {"title": "Tracking an index", "text": "An index fund simply copies an index. A small gap against the index is normal (mostly the fund's charges); a big gap deserves a look."}, "concentration": {"title": "Concentration", "text": "How much of your money sits in one fund or one type of fund. The more concentrated, the more one bad patch affects the whole portfolio."}}, "disclaimer": "This report describes how your funds have behaved in the past using the data shown. Past performance does not guarantee future results. It is general information and observations to discuss, not personal investment advice or a recommendation to buy, sell or switch any fund. Please speak to a registered adviser before acting on it.", "credits": "Fund data: AMFI, compiled by TigZig MFPRO (Amar Harolikar), released under CC0. This report is not affiliated with or endorsed by AMFI or TigZig.", "schema_version": 1}</script>
<script>
(function(){
"use strict";
const STATUS_WORD={good:"Strong",ok:"Fine",watch:"Look closer",attention:"Needs attention",na:"No data"};
const AREA_TOPICS={returns:["returns","calendar","consistency"],risk:["capture","risk"],peers:["peers"],costs:["costs"]};
const FACT_TOPICS=["riskometer","size","age","manager","exit"];
const SHORT={returns:"Returns",risk:"Risk",peers:"Ranking",costs:"Costs"};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inr(x){const n=Math.round(x);let s=String(Math.abs(n));
  if(s.length>3){let h=s.slice(0,-3),t=s.slice(-3),p=[];while(h.length>2){p.unshift(h.slice(-2));h=h.slice(0,-2)}if(h)p.unshift(h);s=p.concat(t).join(",")}
  return (n<0?"-":"")+"₹"+s}
function inrShort(x){const a=Math.abs(x);if(a>=1e7)return "₹"+(a/1e7).toFixed(2)+" crore";if(a>=1e5)return "₹"+(a/1e5).toFixed(2)+" lakh";return inr(x)}
const sgn=v=>(v>=0?"+":"−")+Math.abs(v).toFixed(1)+"%";
const yrs=n=>n+" year"+(n>1?"s":"");

function mark(s){
  const sh={
   good:'<circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 8.8" fill="none" stroke="var(--on)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
   ok:'<circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7.5 12h9" stroke="var(--on)" stroke-width="2.4" stroke-linecap="round"/>',
   watch:'<path d="M12 2.5L22.5 20.5H1.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5v4.5M12 17.2v.1" stroke="var(--on)" stroke-width="2.4" stroke-linecap="round"/>',
   attention:'<rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="currentColor"/><path d="M12 6.5v6.5M12 16.7v.1" stroke="var(--on)" stroke-width="2.4" stroke-linecap="round"/>',
   info:'<circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 11v6M12 7.2v.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
   na:'<circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M9.5 9.6a2.6 2.6 0 115 .6c0 1.7-2.5 1.9-2.5 3.5M12 17v.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'};
  return '<svg class="mk s-'+s+'" viewBox="0 0 24 24" aria-hidden="true">'+sh[s]+'</svg>';
}
const CHEV='<svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const tone=s=>"--c:var(--"+s+");--t:var(--"+s+"-t);--i:var(--"+s+"-i)";

/* ---------- mini visuals ---------- */
function brow(label,val,max,toneName,text){
  const bg=toneName==="bench"?"var(--bench)":"var(--"+toneName+")";
  return '<div class="br"><span>'+esc(label)+'</span><span class="trk"><span class="fill" style="width:'+Math.max(2,val/max*100).toFixed(1)+'%;background:'+bg+'"></span></span><b>'+esc(text)+'</b></div>';
}
function barPair(cap,rows,fmt,status,full){
  const max=full||Math.max.apply(null,rows.map(r=>r[1]));
  if(!(max>0)||rows.some(r=>r[1]<0))return "";
  return '<div class="viz"><div class="cap">'+esc(cap)+'</div>'+rows.map((r,k)=>brow(r[0],r[1],max,k?"bench":status,fmt(r[1]))).join("")+'</div>';
}
function horizonTable(by){
  if(!by||by.length<2)return "";
  return '<div class="tbl" role="table" aria-label="Returns by period"><b>Period</b><b>This fund</b><b>Benchmark</b><b>Difference</b>'
    +by.map(r=>'<span>'+yrs(r.years)+'</span><span>'+r.fund.toFixed(1)+'% a year</span><span>'+r.bench.toFixed(1)+'% a year</span><span class="d" style="color:var(--'+(r.gap>=1?"good":r.gap<=-1?"attention":"muted")+')">'+(r.gap>=0?"+":"−")+Math.abs(r.gap).toFixed(1)+' pts</span>').join("")+'</div>';
}
function calViz(n){
  const ys=n.years,F=n.fund,B=n.bench,k=ys.length;
  const all=F.concat(B,[0]),max=Math.max.apply(null,all),min=Math.min.apply(null,all);
  const W=Math.max(320,k*70),H=196,top=20,bot=48,ph=H-top-bot;
  const y=v=>top+(max-v)/((max-min)||1)*ph,zero=y(0),gw=W/k,bw=Math.min(20,gw/3);
  let s='<line x1="0" x2="'+W+'" y1="'+zero+'" y2="'+zero+'" stroke="var(--line)" stroke-width="1.5"/>';
  ys.forEach((yr,i)=>{
    const cx=gw*i+gw/2;
    [[F[i],cx-bw-1.5,F[i]>B[i]?"var(--good)":"var(--watch)",true,"This fund"],[B[i],cx+1.5,"var(--bench)",false,"Benchmark"]].forEach(a=>{
      const v=a[0],x=a[1],y1=y(v),h=Math.max(1.5,Math.abs(y1-zero)),yy=v>=0?y1:zero;
      s+='<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="2.5" fill="'+a[2]+'"><title>'+a[4]+' in '+yr+': '+sgn(v)+'</title></rect>';
      if(a[3])s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(v>=0?y1-4:y1+12).toFixed(1)+'" text-anchor="middle" class="vl">'+Math.round(v)+'%</text>';
    });
    const al=n.alpha[i];
    s+='<text x="'+cx.toFixed(1)+'" y="'+(H-26)+'" text-anchor="middle" class="yl">'+yr+'</text>'
      +'<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="al" fill="var(--ink)"><title>Alpha in '+yr+': '+(al>=0?"+":"−")+Math.abs(al).toFixed(1)+' points</title>'+(al>=0?"+":"−")+Math.abs(al).toFixed(1)+'</text>';
  });
  return '<div class="viz"><div class="cap">Return in each calendar year</div><svg class="cal" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Fund and benchmark return for each of the last '+k+' calendar years">'+s+'</svg>'
    +'<div class="key2"><span><i style="background:var(--good)"></i>This fund beat the benchmark</span><span><i style="background:var(--watch)"></i>This fund was behind</span><span><i style="background:var(--bench)"></i>Benchmark</span></div>'
    +'<p class="hint">The figure under each year is the fund\u2019s margin over the benchmark (often called alpha): its return minus the benchmark\u2019s, in percentage points. Average margin: <b>'+(n.avg_alpha>=0?"+":"−")+Math.abs(n.avg_alpha).toFixed(1)+' points a year</b>.</p></div>';
}
function dots(k,status,cap){
  let d="";for(let j=0;j<10;j++)d+='<i class="'+(j<k?"on":"")+'"></i>';
  return '<div class="viz" style="'+tone(status)+'"><div class="cap">'+esc(cap)+'</div><div class="dots" role="img" aria-label="'+k+' out of 10">'+d+'</div></div>';
}
function capViz(n){
  const u=n.upside,d=n.downside,max=Math.max(100,u,d);
  const ut=u>=100?"good":(u>=90?"ok":"watch"),dt=d<=100?"good":(d<=110?"watch":"attention");
  return '<div class="viz"><div class="cap">When the market rose: for every ₹100 the benchmark gained</div>'
    +brow("Benchmark",100,max,"bench","₹100")+brow("This fund",u,max,ut,"₹"+Math.round(u))
    +'<div class="cap gap">When the market fell: for every ₹100 the benchmark lost</div>'
    +brow("Benchmark",100,max,"bench","₹100")+brow("This fund",d,max,dt,d<=0?"₹0":"₹"+Math.round(d))
    +'<p class="hint">Longer is better when the market rises. Shorter is better when it falls.</p></div>';
}
const QN={1:"Top quarter",2:"Second quarter",3:"Third quarter",4:"Bottom quarter"},QT={1:"good",2:"ok",3:"watch",4:"attention"};
function qViz(n){
  const hs=Object.keys(n.quartiles).map(Number).sort((a,b)=>a-b);
  return '<div class="viz"><div class="cap">Its place among'+(n.peer_count?" "+n.peer_count:"")+' '+esc(n.category)+' funds</div>'
   +hs.map(h=>{const q=n.quartiles[h];return '<div class="qrow"><span>'+yrs(h)+'</span><span class="qbox" role="img" aria-label="Quartile '+q+' of 4">'
     +[1,2,3,4].map(j=>'<i class="'+(j===q?"on":"")+'" style="--c:var(--'+QT[q]+')">Q'+j+'</i>').join("")+'</span><b>'+QN[q]+'</b></div>'}).join("")
   +'<p class="hint">Q1 is the best quarter of the category and Q4 is the worst.</p></div>';
}
function meter(p,cap,status){
  return '<div class="viz" style="'+tone(status)+'"><div class="cap">'+esc(cap)+'</div><div class="meter" role="img" aria-label="'+Math.round(p)+' percent"><span style="width:'+Math.min(100,p)+'%"></span></div></div>';
}
function stats(items){
  return '<div class="viz"><div class="stat">'+items.map(x=>'<div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join("")+'</div></div>';
}
function viz(i){
  const n=i.numbers||{},s=i.status;
  switch(i.topic){
    case "returns":{
      const bars=n.horizon_years>1?barPair("₹1,00,000 invested "+n.horizon_years+" years ago would be worth",[["This fund",n.fund_value],["Benchmark",n.bench_value]],inr,s)
        :barPair("Return over the last year",[["This fund",n.fund_cagr],["Benchmark",n.bench_cagr]],v=>v.toFixed(1)+"%",s);
      return bars+horizonTable(n.by_horizon);}
    case "calendar": return calViz(n);
    case "consistency": return dots(Math.round(n.beat_pct/10),s,"Periods where it beat the benchmark, out of every 10");
    case "capture": return capViz(n);
    case "risk": return barPair("₹1,00,000 fell to",[["This fund",n.fund_after],["Benchmark",n.bench_after]],inr,s,100000);
    case "peers": return qViz(n);
    case "costs":
      if(n.category_median!=null){
        const t=n.gap_pts<=-0.15?"good":n.gap_pts<=0.15?"ok":n.gap_pts<=0.4?"watch":"attention";
        return barPair("Yearly charge (TER): this fund vs the middle "+n.category+" "+n.plan+" plan",
          [["This fund",n.ter],["Category median",n.category_median]],v=>v.toFixed(2)+"%",t)
          +stats([[inr(n.annual_cost),"in fund charges each year on your holding (already deducted from returns)"]]);}
      if(n.annual_cost!=null)return stats([[inr(n.annual_cost),"in fund charges each year (already deducted from returns)"]]);
      return "";
    case "mix":
      if(n.share_pct!=null)return meter(n.share_pct,"Share of your portfolio",s);
      if(n.category_share_pct!=null)return meter(n.category_share_pct,"Share of your portfolio in your largest category",s);
      return "";
  }
  return "";
}

/* ---------- pieces ---------- */
function insight(i,showFund,gl){
  const g=i.jargon_term&&gl[i.jargon_term];
  const fact=FACT_TOPICS.indexOf(i.topic)>=0&&i.status==="ok";
  return '<article class="ins" style="'+tone(fact?"na":i.status)+'"><div class="ins-h">'+mark(fact?"info":i.status)+'<h4>'+esc(i.headline)+'<span class="vh"> ('+(fact?"For information":STATUS_WORD[i.status])+')</span></h4></div>'
   +'<p>'+(showFund&&i.fund?'<span class="who">'+esc(i.fund)+'. </span>':"")+esc(i.sentence)+'</p>'
   +viz(i)
   +(i.suggestion?'<div class="ask">'+esc(i.suggestion)+'</div>':"")
   +(g?'<details class="learn"><summary>What does “'+esc(g.title)+'” mean?</summary><p>'+esc(g.text)+'</p></details>':"")
   +'</article>';
}
function sections(secs,showFund,gl){
  return secs.map(s=>'<h5 class="sec">'+esc(s.title)+'</h5><p class="what">'+esc(s.what)+'</p>'+s.insights.map(i=>insight(i,showFund,gl)).join("")).join("");
}
function bucket(f){
  if(f.verdict==="Limited data"||f.verdict==="Not enough data")return "na";
  return (f.status==="good"||f.status==="ok")?"healthy":"concern";
}
const fundTone=f=>bucket(f)==="na"?"na":f.status;

function hero(R){
  const tot=R.funds.reduce((a,f)=>a+f.share_pct,0)||100;
  const sum=b=>R.funds.filter(f=>bucket(f)===b).reduce((a,f)=>a+f.share_pct,0)/tot*100;
  const h=Math.round(sum("healthy")),c=Math.round(sum("concern")),u=Math.max(0,100-h-c);
  let big;
  if(c===0&&u===0)big="All of your money is in funds that look healthy.";
  else if(h===0&&u===0)big="All of your money is in funds worth a closer look.";
  else big=h+"% of your money is in funds that look healthy, and "+c+"% is in funds worth a closer look."+(u>=5?" The other "+u+"% has too little data to judge.":"");
  const segs=R.funds.map((f,k)=>'<button class="seg" style="--c:var(--'+fundTone(f)+');flex:'+Math.max(f.share_pct,1.5)+' 1 0;--n:'+k+'" data-fund="'+k+'" title="'+esc(f.name)+': '+esc(f.verdict)+', '+f.share_pct.toFixed(0)+'% of your money" aria-label="'+esc(f.name)+', '+esc(f.verdict)+', '+f.share_pct.toFixed(0)+' percent of your portfolio. Show details"><span>'+(f.share_pct>=14?esc(f.name.replace(/^Sample /,"")):"")+'</span></button>').join("");
  const leg=[["good","Doing well"],["ok","On track"],["watch","Worth a closer look"],["attention","Needs attention"],["na","Limited data"]]
    .filter(x=>R.funds.some(f=>fundTone(f)===x[0])).map(x=>'<li><i style="--c:var(--'+x[0]+')"></i>'+x[1]+'</li>').join("");
  return '<div class="hero"><h2>'+esc(big)+'</h2><p class="sub">'+esc(R.headline)+'</p>'
    +'<div class="ribbon" role="group" aria-label="Your money, split by fund">'+segs+'</div><ul class="legend">'+leg+'</ul></div>';
}

function keyLine(){
  return '<p class="key"><span>'+mark("good")+'Strong</span><span>'+mark("ok")+'Fine</span><span>'+mark("watch")+'Look closer</span><span>'+mark("attention")+'Needs attention</span></p>';
}

function glance(R){
  const gl=R.glossary||{};
  return '<section id="glance"><h3>The check-up at a glance</h3><p class="lede">Tap a line to see which funds it is about.</p>'+keyLine()+'<div class="rows">'
   +R.cards.map(c=>'<details class="row" style="'+tone(c.status)+'"><summary>'+mark(c.status)+'<span class="t">'+esc(c.title)+'<span class="vh"> ('+STATUS_WORD[c.status]+')</span></span>'+CHEV+'<span class="l">'+esc(c.one_liner)+'</span></summary><div class="row-body">'
      +sections(c.sections,true,gl)+'</div></details>').join("")
   +'</div></section>';
}

function areaBlock(f,a,gl){
  const sc=f.scorecard.find(x=>x.topic===a);
  const secs=f.sections.filter(s=>AREA_TOPICS[a].indexOf(s.topic)>=0);
  if(!secs.length&&f.facts&&f.facts.benchmark_applies===false&&(a==="returns"||a==="risk"))return '<details class="area" style="'+tone("na")+'"><summary>'+mark("na")+'<span class="t">'+esc(sc.title)+'<span class="lab">Not compared</span></span>'+CHEV+'<span class="n">This kind of fund is not compared with an index.</span></summary></details>';
  if(!secs.length)return '<details class="area" style="'+tone("na")+'"><summary>'+mark("na")+'<span class="t">'+esc(sc.title)+'<span class="lab">No data</span></span>'+CHEV+'<span class="n">We do not have the data to show this for this fund.</span></summary></details>';
  const open=(sc.status==="watch"||sc.status==="attention")?" open":"";
  return '<details class="area"'+open+' style="'+tone(sc.status)+'"><summary>'+mark(sc.status)+'<span class="t">'+esc(sc.title)+'<span class="lab">'+esc(sc.label)+'</span></span>'+CHEV+'<span class="n">'+esc(sc.note)+'</span></summary><div class="area-body">'+sections(secs,false,gl)+'</div></details>';
}

function factsBlock(f,gl){
  const secs=f.sections.filter(s=>FACT_TOPICS.indexOf(s.topic)>=0);
  if(!secs.length)return "";
  const worst=secs.some(s=>s.insights.some(i=>i.status==="watch"||i.status==="attention"));
  return '<details class="area"'+(worst?" open":"")+' style="'+tone(worst?"watch":"na")+'"><summary>'+mark(worst?"watch":"info")+'<span class="t">Good to know<span class="lab">'+(worst?"Worth a look":"For your information")+'</span></span>'+CHEV+'<span class="n">Risk label, fund size, track record, manager and exit load.</span></summary><div class="area-body">'+sections(secs,false,gl)+'</div></details>';
}
function factsStrip(f){
  const x=f.facts||{},it=[];
  if(x.plan)it.push("<b>"+esc(x.plan.charAt(0).toUpperCase()+x.plan.slice(1))+"</b> plan");
  if(x.ter!=null)it.push("Charges <b>"+x.ter.toFixed(2)+"%</b> a year");
  if(x.aum_cr!=null)it.push("Fund size <b>"+inr(x.aum_cr)+" crore</b>");
  if(x.riskometer)it.push("Risk label <b>"+esc(x.riskometer)+"</b>");
  if(x.age_years!=null)it.push("<b>"+x.age_years+"</b> years old");
  if(x.manager_months!=null)it.push("Manager for <b>"+(x.manager_months<24?x.manager_months+" months":Math.round(x.manager_months/12)+" years")+"</b>");
  if(x.benchmark&&x.benchmark_applies!==false)it.push("Compared with <b>"+esc(x.benchmark)+"</b>");
  return it.length?'<ul class="facts" aria-label="Key facts">'+it.map(t=>"<li>"+t+"</li>").join("")+"</ul>":"";
}
function funds(R){
  const gl=R.glossary||{};
  return '<section id="funds"><h3>Your funds, one by one</h3><p class="lede">Each fund has a four-part scorecard. Funds that need a look are open.</p>'
   +R.funds.map((f,k)=>{const t=fundTone(f);
     const chips=f.scorecard.map(s=>'<span class="chip" style="'+tone(s.status)+'">'+mark(s.status)+esc(SHORT[s.topic])+'<span class="vh"> ('+esc(s.label)+')</span></span>').join("");
     const bl=(f.going_well.length||f.look_at.length)?'<div class="bl">'
        +(f.going_well.length?'<div><h4>Going well</h4><ul>'+f.going_well.map(x=>'<li style="'+tone("good")+'">'+mark("good")+'<span>'+esc(x)+'</span></li>').join("")+'</ul></div>':"")
        +(f.look_at.length?'<div><h4>Worth a look</h4><ul>'+f.look_at.map(x=>'<li style="'+tone("watch")+'">'+mark("watch")+'<span>'+esc(x)+'</span></li>').join("")+'</ul></div>':"")+'</div>':"";
     return '<details class="fund" id="fund-'+k+'"'+((f.status==="watch"||f.status==="attention")&&t!=="na"?" open":"")+'><summary><span class="fname">'+esc(f.name)+'</span>'
       +'<span class="fmeta"><span>'+esc(f.category)+'</span><span>'+f.share_pct.toFixed(0)+'% of your money</span><span>'+inrShort(f.value)+'</span></span>'
       +'<span class="chips">'+chips+'</span>'
       +'<span class="pill" style="'+tone(t)+'">'+mark(t)+esc(f.verdict)+'</span></summary><div class="fund-body">'
       +(f.sections.length?factsStrip(f)+(f.notes||[]).map(n=>'<p class="fnote">'+esc(n)+'</p>').join("")+bl+Object.keys(AREA_TOPICS).map(a=>areaBlock(f,a,gl)).join("")+factsBlock(f,gl):'<p>There is not enough data on this fund to say much yet.</p>')
       +'</div></details>'}).join("")
   +'</section>';
}

function whole(R){
  const gl=R.glossary||{};
  const c=R.cards.find(x=>x.topic==="mix");
  if(!c)return "";
  return '<section id="whole"><h3>Across your whole portfolio</h3><p class="lede">This looks at your funds together, not one at a time.</p><div style="background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:0 1.1rem 1.1rem">'
    +c.insights.map(i=>insight(i,false,gl)).join("")+'</div></section>';
}

function questions(R){
  if(!R.flags.length)return "";
  const groups={};
  R.flags.forEach(i=>{const who=i.fund||"Your portfolio as a whole";(groups[who]=groups[who]||[]).push(i)});
  return '<section id="ask"><h3>Questions worth taking to your adviser</h3><p class="lede">These are things to ask about, not instructions. Past results do not decide what to do next.</p>'
   +Object.keys(groups).map(w=>{const seen={};return '<div class="q"><h4>'+esc(w)+'</h4><ul>'+groups[w].filter(i=>{if(seen[i.suggestion])return false;seen[i.suggestion]=1;return true})
     .map(i=>'<li style="'+tone(i.status)+'">'+mark(i.status)+'<span>'+esc(i.suggestion)+'</span></li>').join("")+'</ul></div>'}).join("")
   +'</section>';
}

function gaps(R){
  if(!R.data_gaps.length)return "";
  return '<section id="gaps"><h3>What we could not check</h3><p class="lede">We only show what the data supports. Nothing here is guessed.</p><ul class="gaps">'+R.data_gaps.map(g=>'<li>'+esc(g)+'</li>').join("")+'</ul></section>';
}

function page(R){
  const sample=/sample/i.test(R.data_source||"")||/sample/i.test(R.as_of||"");
  return '<header class="top"><h1>Your mutual fund check-up</h1><span class="asof">'+(R.as_of?"Data as of "+esc(R.as_of):"")+(R.data_source?" from "+esc(R.data_source):"")+'</span></header>'
   +(sample?'<p class="sample">This page shows made-up sample funds, not a real portfolio.</p>':"")
   +hero(R)+glance(R)+funds(R)+whole(R)+questions(R)+gaps(R)
   +'<footer class="foot"><p>'+esc(R.disclaimer)+'</p><p class="credit">'+esc(R.credits||"")+'</p>'+(window.MFAdvisor&&window.MFAdvisor.onUpload?'<button class="btn" id="again" type="button">Check another portfolio</button>':"")
   +(/[?&]dev\b/.test(location.search)?'<p><label class="btn" for="load">Open another report (JSON)</label><input id="load" type="file" accept="application/json,.json" class="vh"></p>':"")+'<div id="loaderr"></div></footer>';
}

function mount(R){
  const app=document.getElementById("app");
  app.innerHTML=page(R);
  app.querySelectorAll(".seg").forEach(b=>b.addEventListener("click",()=>{
    const d=document.getElementById("fund-"+b.dataset.fund);d.open=true;d.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"});d.querySelector("summary").focus({preventScroll:true});}));
  const ag=document.getElementById("again");if(ag)ag.addEventListener("click",()=>landing());
  const ld=document.getElementById("load");if(ld)ld.addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.funds||!j.cards||!j.funds.every(x=>x.scorecard))throw new Error("x");mount(j);window.scrollTo(0,0)}
      catch(_){document.getElementById("loaderr").innerHTML='<p class="err">That file is not a report from the check-up engine. Create one with “python -m mf_plain --json” and try again.</p>'}};
    r.readAsText(f)});
}

const app=()=>document.getElementById("app");
function top(){return '<header class="top"><h1>Your mutual fund check-up</h1></header>'}
function landing(){
  const api=window.MFAdvisor||{},accept=api.accept||".csv,.xlsx,.xls,.pdf";
  app().innerHTML=top()+'<div class="start"><h2>See how your mutual funds are really doing</h2>'
   +'<p class="sub">Upload your holdings and get a plain-language report: how each fund compares with its index and with similar funds, what it costs, and what is worth asking your adviser.</p>'
   +'<label class="drop" id="drop"><b>Choose your holdings file</b><span>or drag it here. CSV, Excel or a statement PDF.</span><input id="file" type="file" accept="'+esc(accept)+'"></label>'
   +'<p class="privacy"><b>Your file is not saved.</b> We use it only to build this report, then discard it. Close the page and the report is gone.</p>'
   +'<div class="alt"><span>No file handy?</span><button class="btn" id="trysample" type="button">See a sample report</button></div><div id="loaderr" role="alert"></div>'
   +'<ol class="steps"><li><b>Upload</b><span>Your broker holdings file or a CAMS/KFintech statement.</span></li><li><b>We compare</b><span>Each fund against its index and against funds of the same type.</span></li><li><b>You read</b><span>Short sentences, simple pictures, and questions to take to your adviser.</span></li></ol>'
   +'<div class="checks"><h3>What we check for every fund</h3><ul>'
   +[["Growth over 1, 3 and 5 years","Against its index"],["Year by year","And by how much it was ahead or behind"],["Every possible start date","Not just one lucky day"],["Rising and falling markets","How much of each the fund took"],["Its rank among similar funds","Top quarter to bottom quarter"],["What you pay","Against the middle fund in its category"]].map(x=>"<li>"+esc(x[0])+"<small>"+esc(x[1])+"</small></li>").join("")
   +'</ul></div><footer class="foot"><p>This is general information to discuss with an adviser. It is not investment advice, and past performance does not guarantee future results.</p></footer></div>';
  const drop=document.getElementById("drop"),inp=document.getElementById("file");
  const pick=f=>{if(!f)return;if(api.onUpload){api.onUpload(f)}else{document.getElementById("loaderr").innerHTML='<p class="err">Uploading is not connected in this preview.</p>'}};
  inp.addEventListener("change",()=>pick(inp.files[0]));
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>pick(e.dataTransfer.files[0]));
  document.getElementById("trysample").addEventListener("click",()=>{const s=document.getElementById("sample");if(s&&s.textContent.trim()!=="null")mount(JSON.parse(s.textContent))});
  window.scrollTo(0,0);
}
function loading(msg){app().innerHTML=top()+'<div class="state" role="status"><div class="spin"></div><h2>'+esc(msg||"Building your check-up")+'</h2><p>This usually takes a few seconds.</p></div>'}
function failure(msg){app().innerHTML=top()+'<div class="state" role="alert"><h2>We could not build your report</h2><p class="err">'+esc(msg||"Something went wrong.")+'</p><p><button class="btn primary" id="retry" type="button">Try again</button></p></div>';document.getElementById("retry").addEventListener("click",landing)}
window.MFAdvisor=Object.assign(window.MFAdvisor||{},{show:mount,loading:loading,error:failure,start:landing});
const first=JSON.parse(document.getElementById("report").textContent);
if(first)mount(first);else landing();
})();
</script>
</body>
</html>
